name: Release

# `pull_request_target` on close no longer has permission to write the Docker
# build cache to GitHub Actions Cache.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # Squash-merge lands a release PR on main as `release: vX.Y.Z (#N)`.
    if: >
      startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-24.04-arm
    env:
      ECR_REPOSITORY: transform/teacher-workspace
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve version
        id: resolve-version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          TITLE="${COMMIT_MESSAGE%%$'\n'*}"
          if [[ ! "$TITLE" =~ ^release:[[:space:]]v([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]\(#([0-9]+)\)$ ]]; then
            echo "::error::Commit title must look like 'release: v1.2.3 (#123)', got '${TITLE}'"
            exit 1
          fi
          VERSION="v${BASH_REMATCH[1]}"
          PR_NUMBER="${BASH_REMATCH[2]}"

          DECLARED="$(jq -r '.version' package.json)"
          if [[ "$VERSION" != "v${DECLARED}" ]]; then
            echo "::error::Commit title says ${VERSION}, root package.json declares v${DECLARED}"
            exit 1
          fi

          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/${VERSION}" > /dev/null; then
            echo "::error::Tag ${VERSION} already exists"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pr-number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Unlike the git tag guard above, an existing image tag only means a run
      # died before tagging, so skip the build and carry on.
      - name: Check for existing image tag
        id: check-existing-image-tag
        env:
          VERSION: ${{ steps.resolve-version.outputs.version }}
        run: |
          if OUTPUT="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${VERSION}" 2>&1)"; then
            echo "::notice::${VERSION} is already in ECR, skipping the build"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$OUTPUT" == *ImageNotFoundException* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not query ECR for ${VERSION}: ${OUTPUT}"
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.check-existing-image-tag.outputs.exists != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract metadata for image
        id: metadata
        if: steps.check-existing-image-tag.outputs.exists != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=${{ steps.resolve-version.outputs.version }}

      - name: Build and push image
        if: steps.check-existing-image-tag.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=teacher-workspace
          cache-to: type=gha,mode=max,scope=teacher-workspace

      - name: Tag release
        env:
          VERSION: ${{ steps.resolve-version.outputs.version }}
          PR_NUMBER: ${{ steps.resolve-version.outputs.pr-number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Automated release $VERSION (#${PR_NUMBER})"
          git push origin "$VERSION"
