min_version = "2026.10.20"

[tasks.fmt]
description = "Go formatter"
run = "golangci-lint fmt"

[tasks.lint]
description = "Go linter"
run = "golangci-lint run"

[tools]
"github:golangci/golangci-lint" = "2.14.0"
go = "1.27.3"
node = "24.22.1"
"npm:pnpm" = "11.22.0"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64"]
